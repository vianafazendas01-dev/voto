name: Inspecionar logotipo oficial

on:
  push:
    paths:
      - .github/workflows/inspect-cloudflare.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Localizar imagem oficial publicada
        shell: python
        run: |
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          url = "https://www.parcelenahora.com.br/quem-somos"
          req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          html = urlopen(req, timeout=20).read().decode("utf-8", "replace")

          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag.lower() == "img" and data.get("src"):
                      self.images.append((data.get("alt", ""), urljoin(url, data["src"])))

          parser = Inspect()
          parser.feed(html)
          print("IMAGENS_OFICIAIS")
          for alt, src in parser.images:
              safe_src = src if not src.startswith("data:") else src[:80] + "...[dados incorporados]"
              print(f"alt={alt!r} src={safe_src!r}")
