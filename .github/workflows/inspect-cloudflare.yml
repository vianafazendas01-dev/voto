name: Inspecionar versão atual do Cloudflare

on:
  push:
    paths:
      - .github/workflows/inspect-cloudflare.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Ler somente estrutura pública
        shell: python
        run: |
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          url = "https://sistemadevotosparcelenahora.pages.dev/"
          req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          html = urlopen(req, timeout=20).read().decode("utf-8", "replace")

          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "img":
                      data = dict(attrs)
                      self.images.append((data.get("alt", ""), data.get("src", "")))
              def handle_data(self, data):
                  value = " ".join(data.split())
                  if value:
                      self.text.append(value)

          parser = Inspect()
          parser.feed(html)
          print("IMAGENS")
          for alt, src in parser.images:
              safe_src = src if not src.startswith("data:") else src[:80] + "...[dados incorporados]"
              print(f"alt={alt!r} src={safe_src!r}")
          print("TEXTOS")
          print(" | ".join(parser.text)[:5000])
