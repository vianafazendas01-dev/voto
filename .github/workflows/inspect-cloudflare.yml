name: Inspecionar versão atual do Cloudflare

on:
  push:
    paths:
      - .github/workflows/inspect-cloudflare.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Ler somente estrutura pública
        shell: python
        run: |
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          import re

          url = "https://sistemadevotosparcelenahora.pages.dev/"
          def get(target):
              req = Request(target, headers={"User-Agent": "Mozilla/5.0"})
              return urlopen(req, timeout=20).read()

          html = get(url).decode("utf-8", "replace")
          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag.lower() == "img" and data.get("src"):
                      self.assets.append(("img", urljoin(url, data["src"])))
                  if tag.lower() == "script" and data.get("src"):
                      self.assets.append(("script", urljoin(url, data["src"])))
                  if tag.lower() == "link" and data.get("href"):
                      self.assets.append(("link", urljoin(url, data["href"])))
              def handle_data(self, data):
                  value = " ".join(data.split())
                  if value:
                      self.text.append(value)

          parser = Inspect()
          parser.feed(html)
          print("RECURSOS")
          for kind, asset in parser.assets:
              print(kind, asset)
              if kind == "script":
                  js = get(asset).decode("utf-8", "replace")
                  print("script_bytes", len(js.encode("utf-8")))
                  paths = sorted(set(re.findall(r'[^"\x27]{0,80}\.(?:png|webp|svg|jpe?g)', js, flags=re.I)))
                  print("image_paths", paths[:30])
                  data_images = re.findall(r'data:image/(png|webp|jpeg);base64,([A-Za-z0-9+/=]+)', js)
                  print("data_images", [(mime, len(data)) for mime, data in data_images[:20]])
          print("TEXTOS_HTML")
          print(" | ".join(parser.text)[:5000])
