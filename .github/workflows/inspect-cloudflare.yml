name: Verificar publicação no Cloudflare

on:
  push:
    paths:
      - .github/workflows/inspect-cloudflare.yml
      - index.html
      - dist/index.html

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir endereço oficial
        shell: python
        run: |
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          import time

          url = "https://sistemadevotosparcelenahora.pages.dev/"
          time.sleep(20)
          req = Request(url, headers={"User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache"})
          html = urlopen(req, timeout=30).read().decode("utf-8", "replace")
          print("VERSAO_NOVA", "voto-design-20260902" in html)

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag.lower() == "script" and data.get("src"):
                      self.scripts.append(urljoin(url, data["src"]))

          parser = Scripts()
          parser.feed(html)
          for script in parser.scripts:
              try:
                  response = urlopen(Request(script, headers={"User-Agent": "Mozilla/5.0"}), timeout=20)
                  print("SCRIPT", response.status, script)
              except Exception as exc:
                  print("SCRIPT_ERRO", type(exc).__name__, script)
